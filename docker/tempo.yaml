# Dev Tempo: local-filesystem trace storage, no object store needed.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # the embedded otel receiver defaults to localhost — inside a
        # container that refuses anything from other containers
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
