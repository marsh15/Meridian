[project]
name = "meridian-api"
version = "1.0.0"
description = "Meridian prediction market API — FastAPI + SQLAlchemy + Postgres"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # outbox->Kafka relay + consumers (separate processes); the API app
    # itself never imports this
    "aiokafka>=0.12",
    "temporalio>=1.33.0",
    # rate limiting + hot-market cache + SSE fan-out (fails open without it)
    "redis>=5.2",
    # outbound HTTP: intel-layer retrieval + the OpenAI-compatible LLM client
    "httpx>=0.28",
    # traces + metrics to the OTLP collector (disabled unless OTEL endpoint set)
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "fakeredis>=2.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PERF", "RUF", "SIM"]
ignore = [
    # the fail-open design (docs/failure-model.md, ADR 0009) swallows
    # Redis/stream/network errors on purpose — the API stays correct
    # without those dependencies
    "BLE001",
    "S110",
    "S112",
    # cents signs, arrows, and × in comments/strings are deliberate
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in tests is fine
# conftest sets env vars before importing the app on purpose
"tests/conftest.py" = ["E402"]
# the seed file is data: long question/description strings don't rewrap
"app/seed.py" = ["E501"]
