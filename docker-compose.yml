services:
  db:
    image: postgres:16-alpine
    container_name: meridian-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      # host 5434 — 5432 and 5433 are both taken by a local Postgres.
      # Loopback-only: a dev stack must not expose Postgres (or anything
      # else here) to the LAN — Grafana runs anonymous-Admin, stores have
      # dev passwords
      - "127.0.0.1:5434:5432"
    volumes:
      - meridian-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 3s
      timeout: 3s
      retries: 15

  kafka:
    # single-node KRaft (no ZooKeeper) — the event backbone (ROADMAP phase 2)
    image: apache/kafka:3.9.0
    container_name: meridian-kafka
    restart: unless-stopped
    environment:
      KAFKA_CLUSTER_ID: 1ipWTG-ZQviT0CHS7GsyrA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # host processes (relay, consumers) bootstrap localhost:9092;
      # anything inside the compose network uses kafka:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topics come from scripts/provision-topics.sh, never auto-creation
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - meridian-kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  temporal-db:
    # throwaway store for Temporal's own event histories — kept off the app
    # database so workflow history never competes with market data
    image: postgres:16-alpine
    container_name: meridian-temporal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - meridian-temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 3s
      timeout: 3s
      retries: 15

  temporal:
    # durable market-lifecycle workflows (ROADMAP phase 3): auto-close timers
    # and resolution → settlement run here instead of in the API process
    image: temporalio/auto-setup:1.29.7
    container_name: meridian-temporal
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      # default binds only the container's eth0 address; 0.0.0.0 lets the
      # loopback healthcheck (and any network mode) reach the frontend
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ./docker/temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    healthcheck:
      # the bundled tctl/CLI builds in this image are unreliable; a TCP
      # connect to the frontend port is enough for compose gating
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7233'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  redis:
    # rate limiting + hot-market cache + SSE tick fan-out (ROADMAP phase 5).
    # Everything touching it fails open — the API stays correct without it.
    image: redis:7-alpine
    container_name: meridian-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # host 6399 — 6379 is commonly taken by a local Redis
      - "127.0.0.1:6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  # ------------------------- observability (phase 5) -------------------------
  # Every meridian process pushes OTLP to the collector; Prometheus scrapes
  # the collector, Tempo stores traces, Grafana reads both. The order-
  # pipeline dashboard lives in docker/grafana/dashboards/.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: meridian-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # host 4319 — something in Docker Desktop's backend already squats 4318
      - "127.0.0.1:4319:4318"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: meridian-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"

  tempo:
    # trace storage on a throwaway volume — dev-only, no object store
    image: grafana/tempo:2.7.0
    container_name: meridian-tempo
    restart: unless-stopped
    # the image runs as uid 10001, which can't mkdir inside a fresh
    # root-owned named volume; dev container just runs as root
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - meridian-tempodata:/tmp/tempo
    ports: []  # tempo is reached inside the compose network (grafana → tempo:3200)

  grafana:
    image: grafana/grafana:11.5.0
    container_name: meridian-grafana
    restart: unless-stopped
    environment:
      # local dev dashboard — no login friction
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3002:3000"

  temporal-ui:
    # optional: `docker compose --profile ui up` → http://localhost:8081
    image: temporalio/ui:2.35.0
    container_name: meridian-temporal-ui
    profiles: ["ui"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: localhost:7233
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  meridian-pgdata:
  meridian-kafkadata:
  meridian-temporal-pgdata:
  meridian-tempodata:
